<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Vicit Data Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; background: var(--grad); }
    .auth-card { width: 410px; max-width: 92vw; padding: 38px; }
    .brand-lockup { display:flex; flex-direction:column; align-items:center; margin-bottom: 8px; }
    .brand-lockup img { height: 44px; margin-bottom: 6px; }
    .auth-card h1 { font-size: 22px; text-align:center; }
    .auth-card .sub { text-align:center; color: var(--muted); font-size: 14px; margin: 4px 0 22px; }
    .auth-card form { margin-top: 18px; }
    .auth-card label { margin-top: 14px; }
    .btn-block { width: 100%; justify-content: center; }
    .divider { display:flex; align-items:center; margin: 20px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content:''; flex:1; border-top:1px solid var(--line); }
    .divider::before { margin-right:12px; } .divider::after { margin-left:12px; }
    .alt { text-align:center; margin-top: 18px; font-size: 14px; color: var(--muted); }
    .alt a { color: var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <div class="card auth-card">
    <div class="brand-lockup">
      <img src="{{ url_for('static', filename='vicit.png') }}" alt="Vicit">
      <h1>Vicit Data Intelligence</h1>
    </div>
    <p class="sub">Sign in to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}

    <a href="{{ url_for('login_microsoft') }}" class="btn btn-ghost btn-block">
      <svg viewBox="0 0 21 21" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </a>

    <div class="divider">or sign in with password</div>

    <form method="POST" id="login-form">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" autofocus>
      <label for="password">Password</label>
      <input type="password" name="password" id="password">
      <input type="hidden" name="g-recaptcha-response" id="recaptcha-token">
      <button type="submit" class="btn btn-accent btn-block" style="margin-top:20px;">Sign In</button>
    </form>
    <p class="alt">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>

  {% if recaptcha_site_key %}
  <script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key }}"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      grecaptcha.ready(function() {
        grecaptcha.execute('{{ recaptcha_site_key }}', {action: 'login'}).then(function(token) {
          document.getElementById('recaptcha-token').value = token;
          document.getElementById('login-form').submit();
        });
      });
    });
  </script>
  {% endif %}
</body>
</html>
