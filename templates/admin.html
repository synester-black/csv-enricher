{% extends "base.html" %}
{% block title %}Admin — Vicit Data Intelligence{% endblock %}
{% block content %}
  <div class="page-head">
    <div>
      <h1>Admin</h1>
      <p>Load the master database workbook into the searchable cache.</p>
    </div>
  </div>
  <div class="card" style="max-width:680px;">
    <form method="POST" action="{{ url_for('admin') }}" enctype="multipart/form-data">
      <label>Master database workbook (.xlsx)</label>
      <input type="file" name="workbook" accept=".xlsx" required>
      <div class="actions"><button class="btn btn-accent" type="submit">Import Master Data</button></div>
    </form>
    {% if result %}
      <div class="flash {{ 'success' if not result.startswith('Error') else 'error' }}" style="margin-top:18px;margin-bottom:0;">{{ result }}</div>
    {% endif %}
  </div>
{% endblock %}
