<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Market Intelligence</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f0f2f5; min-height: 100vh; }
    .container { max-width: 420px; margin: 60px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #666; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #1a1a2e; color: #fff; border: none;
             border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 22px; }
    button:hover { background: #16213e; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .flash.success { background: #d4edda; color: #155724; }
    .flash.error { background: #f8d7da; color: #721c24; }
    .link { text-align: center; margin-top: 18px; font-size: 14px; color: #666; }
    .link a { color: #1a1a2e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Create an Account</h1>
      <p class="sub">Search the technology & market intelligence database for potential companies.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('signup') }}">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Email (optional)</label>
        <input type="email" name="email">
        <label>Full Name</label>
        <input type="text" name="name">
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Confirm Password</label>
        <input type="password" name="confirm" required>
        <button type="submit">Create Account</button>
      </form>
      <div class="link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
    </div>
  </div>
</body>
</html>
