<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Vicit Data Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; background: var(--grad); }
    .auth-card { width: 430px; max-width: 92vw; padding: 38px; }
    .brand-lockup { display:flex; flex-direction:column; align-items:center; margin-bottom: 8px; }
    .brand-lockup img { height: 44px; margin-bottom: 6px; }
    .auth-card h1 { font-size: 22px; text-align:center; }
    .auth-card .sub { text-align:center; color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
    .auth-card label { margin-top: 12px; }
    .btn-block { width: 100%; justify-content: center; }
    .alt { text-align:center; margin-top: 18px; font-size: 14px; color: var(--muted); }
    .alt a { color: var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <div class="card auth-card">
    <div class="brand-lockup">
      <img src="{{ url_for('static', filename='vicit.png') }}" alt="Vicit">
      <h1>Create an account</h1>
    </div>
    <p class="sub">Search the technology &amp; market intelligence database.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('signup') }}">
      <label>Username</label><input type="text" name="username" required autofocus>
      <label>Email (optional)</label><input type="email" name="email">
      <label>Full Name</label><input type="text" name="name">
      <label>Password</label><input type="password" name="password" required>
      <label>Confirm Password</label><input type="password" name="confirm" required>
      <button type="submit" class="btn btn-accent btn-block" style="margin-top:22px;">Create Account</button>
    </form>
    <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</body>
</html>
