services:
  - type: web
    name: csv-enricher
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:7860 --workers 2 --threads 8 --timeout 300 app:app
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma3:27b
      - key: OLLAMA_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_ALLOWED_DOMAIN
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        value: https://br-round-glade-b3rrb5f4.storage.c-4.ap-southeast-1.aws.neon.tech
      - key: AWS_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: csv-upload
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false